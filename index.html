
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тас дәуірі — 3D музей</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#91a8a0;font-family:Arial}
#scene{width:100vw;height:100vh;display:block}
#info{
position:absolute;top:15px;left:50%;
transform:translateX(-50%);
background:#172d25dd;color:white;
padding:12px 22px;border-radius:14px;
text-align:center;width:90%;max-width:420px;
}
#info h2{font-size:20px;margin-bottom:5px}
#info p{font-size:12px}
#help{
position:absolute;bottom:18px;left:50%;
transform:translateX(-50%);
color:white;background:#172d25dd;
padding:12px 18px;border-radius:14px;
font-size:13px;text-align:center;width:90%;
}
</style>
</head>
<body>
<div id="info">
<h2>🪨 ТАС ДӘУІРІ</h2>
<p>Ежелгі адамдар әлеміне қош келдіңіз!</p>
</div>
<div id="help">
👆 Саусағыңмен экранды жылжыт — айналаны көр
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc0d0);
scene.fog=new THREE.Fog(0x9bc0d0,30,100);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x66513a,2));
const sun=new THREE.DirectionalLight(0xffe1ae,3);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color});
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(150,150),
mat(0x9b8054));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function rock(x,y,z,s){
const m=new THREE.Mesh(
new THREE.DodecahedronGeometry(s,1),
mat(0x77736b));
m.position.set(x,y,z);
m.scale.y=.7;
m.castShadow=true;
scene.add(m);
}
for(let i=0;i<65;i++){
let a=Math.random()*Math.PI*2;
let r=12+Math.random()*35;
rock(Math.cos(a)*r,.5,Math.sin(a)*r,.7+Math.random()*2);
}

function cave(x,z){
const group=new THREE.Group();
const body=new THREE.Mesh(
new THREE.SphereGeometry(5,24,16,0,Math.PI*2,0,Math.PI*.72),
mat(0x66564a));
body.scale.set(1.5,1,1);
body.position.y=2;
group.add(body);
const dark=new THREE.Mesh(
new THREE.CircleGeometry(2.2,32),
mat(0x17130f));
dark.position.set(0,1.2,4.7);
group.add(dark);
group.position.set(x,0,z);
scene.add(group);
}
cave(-12,-5);
cave(13,-9);

function hut(x,z){
const g=new THREE.Group();
const base=new THREE.Mesh(
new THREE.CylinderGeometry(2.2,2.5,2.5,8),
mat(0x89704c));
base.position.y=1.25;
g.add(base);
const roof=new THREE.Mesh(
new THREE.ConeGeometry(3,3,8),
mat(0x57452f));
roof.position.y=4;
g.add(roof);
g.position.set(x,0,z);
scene.add(g);
}
hut(-7,5);
hut(8,6);

function tree(x,z){
const g=new THREE.Group();
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.4,3,8),mat(0x60452e));
trunk.position.y=1.5;g.add(trunk);
const leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.8,12,10),mat(0x385c32));
leaves.position.y=3.5;g.add(leaves);
g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<22;i++){
let a=Math.random()*Math.PI*2;
let r=14+Math.random()*24;
tree(Math.cos(a)*r,Math.sin(a)*r);
}

// Адам
function human(x,z,color){
const g=new THREE.Group();
const skin=mat(0xb8794e);
const clothes=mat(color);
const head=new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),skin);
head.position.y=2.5;g.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.47,12,8),mat(0x30241d));
hair.position.y=2.72;g.add(hair);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,4,8),clothes);
body.position.y=1.45;g.add(body);
const arms=[];
for(let side of [-1,1]){
const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.8,4,8),skin);
arm.position.set(side*.58,1.55,0);
arm.rotation.z=side*.25;g.add(arm);arms.push(arm);
}
const legs=[];
for(let side of [-1,1]){
const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.7,4,8),skin);
leg.position.set(side*.23,.48,0);g.add(leg);legs.push(leg);
}
g.position.set(x,0,z);
scene.add(g);
return {g,arms,legs};
}
const people=[
human(-3,1,0x75452e),
human(2,2,0x9b603b),
human(5,-3,0x554c3a)
];

// Мишка
const bear=new THREE.Group();
const brown=mat(0x70452d);
const belly=mat(0xa67b53);
function sphere(parent,x,y,z,sx,sy,sz,material){
const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),material);
m.position.set(x,y,z);m.scale.set(sx,sy,sz);
parent.add(m);return m;
}
sphere(bear,0,1.1,0,1,.95,.75,brown);
sphere(bear,0,2.15,.15,.7,.75,.65,brown);
sphere(bear,0,1.05,.68,.62,.65,.18,belly);
sphere(bear,0,1.95,.72,.4,.28,.22,belly);
for(let x of [-.5,.5]){
sphere(bear,x,2.8,.1,.25,.3,.2,brown);
sphere(bear,x,2.8,.28,.13,.17,.08,belly);
sphere(bear,x*.8,2.25,.9,.07,.08,.04,mat(0x111111));
}
const paws=[];
for(let x of [-.65,.65]){
for(let z of [-.4,.4]){
const p=sphere(bear,x,.35,z,.3,.45,.3,brown);
paws.push(p);
}
}
bear.position.set(0,0,-5);
scene.add(bear);

// От
const fire=new THREE.Group();
for(let i=0;i<8;i++){
const flame=new THREE.Mesh(
new THREE.ConeGeometry(.35,.9,8),
mat(i%2?0xff7b16:0xffd02c));
flame.position.set(Math.cos(i*Math.PI/4)*.35,.65,Math.sin(i*Math.PI/4)*.35);
fire.add(flame);
}
fire.position.set(0,0,3);
scene.add(fire);
const logs=new THREE.Mesh(
new THREE.CylinderGeometry(.15,.15,2,8),
mat(0x49301c));
logs.position.set(0,.15,3);
logs.rotation.z=Math.PI/2;scene.add(logs);

let dragging=false,lastX=0,lastY=0;
let yaw=0,pitch=-.12;
renderer.domElement.addEventListener('pointerdown',e=>{
dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
if(!dragging)return;
yaw-=(e.clientX-lastX)*.005;
pitch-=(e.clientY-lastY)*.004;
pitch=Math.max(-.9,Math.min(.9,pitch));
lastX=e.clientX;lastY=e.clientY;
});

let t=0;
function animate(){
requestAnimationFrame(animate);
t+=.016;

people.forEach((p,i)=>{
p.g.position.x+=Math.sin(t*.4+i)*.002;
p.g.rotation.y=Math.sin(t*.6+i)*.25;
p.legs[0].rotation.x=Math.sin(t*3+i)*.2;
p.legs[1].rotation.x=-Math.sin(t*3+i)*.2;
p.arms[0].rotation.x=Math.sin(t*2+i)*.15;
});

bear.position.x=Math.sin(t*.45)*4;
bear.position.z=-5+Math.cos(t*.45)*2;
bear.rotation.y=Math.cos(t*.45)>0?Math.PI:0;
bear.position.y=Math.abs(Math.sin(t*4))*.08;
paws.forEach((p,i)=>p.rotation.x=Math.sin(t*4+i)*.2);

fire.children.forEach((f,i)=>{
f.scale.y=.7+Math.sin(t*9+i)*.3;
f.rotation.y=t+i;
});
camera.position.set(0,5,16);
camera.rotation.order='YXZ';
camera.rotation.set(pitch,yaw,0);
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
